# ===============================
# Spring Application
# ===============================
spring.application.name=backend
# ===============================
# Server
# ===============================
server.port=8080
server.servlet.context-path=/
# ===============================
# Datasource (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/management_intern?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
# ===============================
# JWT Config
# ===============================
app.jwt.secret=Z!8f@K#6pL$9qR%2uT^5xW&7yB*3cD(1)G_+mS
app.jwt.expiration-ms=86400000
# Other
spring.main.allow-bean-definition-overriding=true
# ===============================
# Multipart File Upload
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# For embedded Tomcat: allow larger request body (bytes), set to -1 for unlimited
server.tomcat.max-swallow-size=52428800
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
# ===============================
# File Upload Config
# ===============================
app.file.upload-dir=${UPLOAD_DIR:./uploads}
app.file.max-size=10485760
# ===============================
# Backup Config
# ===============================
app.backup.dir=${BACKUP_DIR:./backups}
app.backup.retention-days=30
# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.com.example.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# ===============================
# Springdoc OpenAPI / Swagger
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
# ===============================
# Mail (Gmail SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
