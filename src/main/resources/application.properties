spring.application.name=backend
# Server
server.port=8080
# Datasource - MySQL (thay b?ng th�ng tin c?a b?n)
spring.datasource.url=jdbc:mysql://localhost:3306/management_intern?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
