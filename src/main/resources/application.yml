# ===============================
# Spring Application
# ===============================
spring:
  threads:
    virtual:
      enabled: true
  application:
    name: holaho-intern-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/management_intern}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 5000
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
  profiles:
    active: dev # Default to dev
  data:
    elasticsearch:
      repositories:
        enabled: ${APP_ES_ENABLED:false}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 3600000ms # 1 hour
      cache-null-values: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      chat:
        options:
          model: gpt-3.5-turbo

  # ===============================
  # JPA / Hibernate Defaults
  # ===============================
  jpa:
    open-in-view: false
    properties:
      "[hibernate.jdbc.time_zone]": Asia/Ho_Chi_Minh
      "[hibernate.jdbc.lob.non_contextual_creation]": true
      "[hibernate.format_sql]": false

  # ===============================
  # Flyway Migration Defaults
  # ===============================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # ===============================
  # Multipart Configuration
  # ===============================
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # ===============================
  # Mail Configuration
  # ===============================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ===============================
# Server Configuration
# ===============================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  tomcat:
    max-swallow-size: 52428800

# ===============================
# Actuator Monitoring
# ===============================
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# ===============================
# Custom Application Properties
# ===============================
app:
  elasticsearch:
    enabled: ${APP_ES_ENABLED:false} # Disabled by default for local development
  jwt:
    secret: ${JWT_SECRET}  # REQUIRED: No default — app fails to start if missing. Generate with: openssl rand -base64 64
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  file:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-size: 10485760
  backup:
    dir: ${BACKUP_DIR:./backups}
    schedule: ${BACKUP_SCHEDULE:0 0 2 * * *}
    retention-cron: ${BACKUP_RETENTION_CRON:0 0 3 * * *}
    tool-path: ${BACKUP_TOOL_PATH:mysqldump}
    mysql-client-path: ${MYSQL_CLIENT_PATH:mysql}
    max-retry-attempts: 3
    retention:
      daily-days: 7
      weekly-weeks: 4
      monthly-months: 12

# ===============================
# Resilience4j Configuration
# ===============================
resilience4j:
  ratelimiter:
    instances:
      apiRateLimiter:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0
        subscribeForEvents: true

# ===============================
# Springdoc OpenAPI Defaults
# ===============================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
