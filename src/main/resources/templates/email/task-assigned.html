<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bạn có công việc/lịch họp mới</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #dddddd; border-radius: 5px;">
        <h2 style="color: #2196F3;">Thông báo: Bạn có công việc/lịch họp mới</h2>
        <p>Xin chào <strong>${name}</strong>,</p>
        <p>Bạn đã được giao một công việc/lịch họp mới trên hệ thống.</p>
        <div style="background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin: 20px 0;">
            <p style="margin: 0 0 5px 0;"><strong>Tiêu đề:</strong> ${taskTitle}</p>
            <p style="margin: 0 0 5px 0;"><strong>Người giao:</strong> ${creatorName}</p>
            <p style="margin: 0;"><strong>Hạn chót/Thời gian:</strong> ${dueDate}</p>
        </div>
        <p>Vui lòng đăng nhập vào hệ thống để xem chi tiết và thực hiện.</p>
        <hr style="border: 0; border-top: 1px solid #eeeeee; margin: 20px 0;">
        <p style="font-size: 12px; color: #888888;">Hệ thống Quản lý Thực tập</p>
    </div>
</body>
</html>
