<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Lịch hẹn phỏng vấn mới</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #dddddd; border-radius: 5px;">
        <h2 style="color: #FF9800;">Thông báo: Lịch hẹn phỏng vấn mới</h2>
        <p>Xin chào <strong>${name}</strong>,</p>
        <p>Bạn có một lịch hẹn phỏng vấn tuyển dụng mới đã được lên lịch thành công.</p>
        <div style="background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin: 20px 0;">
            <p style="margin: 0 0 5px 0;"><strong>Ứng viên:</strong> ${name}</p>
            <p style="margin: 0;"><strong>Thời gian phỏng vấn:</strong> ${dateTime}</p>
        </div>
        <p>Vui lòng chuẩn bị và tham gia đúng giờ.</p>
        <hr style="border: 0; border-top: 1px solid #eeeeee; margin: 20px 0;">
        <p style="font-size: 12px; color: #888888;">Ban tuyển dụng HoLaHo</p>
    </div>
</body>
</html>
